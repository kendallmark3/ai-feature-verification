# Pipeline mode: runs the committed, promoted suites for a story and posts evidence.
# Start it from the Actions tab with a story key.
name: verify
on:
  workflow_dispatch:
    inputs:
      story:
        description: Jira key, e.g. SHOP-142
        required: true
      env:
        description: Environment from verify.config.json (local, dev, uat)
        default: local
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DEV_BASE_URL: ${{ vars.DEV_BASE_URL }}
      UAT_BASE_URL: ${{ vars.UAT_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: demo-app/package-lock.json }
      - run: npm ci
        working-directory: demo-app
      - run: npx playwright install --with-deps chromium
        working-directory: demo-app
      - name: Pipeline run (refuses @ai-proposed tests)
        run: python3 .claude/skills/verify-feature/scripts/verify.py all "${{ inputs.story }}" --mode pipeline --env "${{ inputs.env }}"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ inputs.story }}
          path: verification/${{ inputs.story }}/
